<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Language Learning Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body data-lang="en">

  <!-- AUTH -->
  <section id="auth" class="auth" hidden>
    <div class="auth-card">
      <div class="brand"><span class="logo">言</span><div><b>Language Hub</b><small>English &amp; 日本語</small></div></div>
      <h2 id="auth-title">เข้าสู่ระบบ</h2>
      <p class="muted" style="margin:0">พื้นที่เรียนภาษาส่วนตัวของคุณ</p>
      <form id="auth-form">
        <div class="field"><label for="auth-email">Email</label><input type="email" id="auth-email" required autocomplete="email" /></div>
        <div class="field"><label for="auth-pass">Password</label><input type="password" id="auth-pass" required minlength="6" autocomplete="current-password" /></div>
        <p id="auth-msg" class="auth-msg"></p>
        <button class="btn block" id="auth-btn" type="submit">เข้าสู่ระบบ</button>
      </form>
      <p class="center small"><span id="auth-switch-text">ยังไม่มีบัญชี?</span> <a href="#" id="auth-switch"><b>สมัครสมาชิก</b></a></p>
    </div>
  </section>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">言</span><div><b>Language Hub</b><small>My study planner</small></div></div>
      <div class="side-lang" id="side-lang"></div>
      <nav id="nav"></nav>
      <div class="side-foot">☁️ ข้อมูลซิงก์กับ Supabase</div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu"><i data-lucide="menu"></i></button>
        <form id="search-form" class="search-box top-search">
          <i data-lucide="search"></i>
          <input id="global-search" placeholder="ค้นหา Grammar, คำศัพท์, คันจิ, เอกสาร..." />
        </form>
        <button id="lang-toggle" class="lang-toggle" title="สลับภาษา"></button>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="modal" class="modal"></div>
  <div id="toasts" class="toasts"></div>
</body>
</html>
